[global]
pid = /tmp/php-example.pid
error_log = /home/ubuntu/logs/php-example-error.log
log_level = notice
daemonize = no

[example-app]
user = ubuntu
group = ubuntu
listen = /tmp/php-example.sock
listen.owner = ubuntu
listen.group = ubuntu
listen.mode = 0660

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Logging
access.log = /home/ubuntu/logs/php-example-access.log
slowlog = /home/ubuntu/logs/php-example-slow.log
request_slowlog_timeout = 10s

; Environment variables
env[HOSTNAME] = $HOSTNAME
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp

; PHP settings
php_admin_value[sendmail_path] = /usr/sbin/sendmail -t -i -f www@example-php.com
php_flag[display_errors] = off
php_admin_value[error_log] = /home/ubuntu/logs/php-example-error.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 30